<!doctype html>

<style>
:root{color-scheme:light dark;--bg:#101c2d;--panel:#19283b;--panel2:#213349;--text:#edf5f7;--muted:#a5b8c4;--line:#33495b;--teal:#42d6c4;--gold:#f3c66b;--red:#ff8585;--shadow:0 8px 28px #0002}
@media(prefers-color-scheme:light){:root{--bg:#f2f7f7;--panel:#fff;--panel2:#e8f2f1;--text:#172a37;--muted:#536b77;--line:#d2e0e2;--teal:#087f78;--gold:#96620b;--red:#b83d45;--shadow:0 8px 28px #163c4a12}}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom));overflow-x:hidden}button,input,select,textarea{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:13px;padding:9px 13px;background:var(--panel2);color:var(--text);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button.primary{background:var(--teal);border-color:var(--teal);color:#09232b;font-weight:750}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}h1,h2,h3,p{margin-top:0}h1{font-size:25px;margin-bottom:3px}h2{font-size:20px;margin-bottom:12px}h3{font-size:16px;margin-bottom:6px}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.wrap{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 20px}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:850;letter-spacing:.3px}.brand span{color:var(--teal)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,var(--panel),var(--panel2));position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:150px;height:150px;border:1px solid #42d6c433;border-radius:50%;right:-55px;top:-60px;box-shadow:0 0 0 22px #42d6c411,0 0 0 45px #42d6c408;pointer-events:none}.levelrow{display:flex;align-items:center;gap:13px}.level{display:grid;place-items:center;width:68px;height:68px;border-radius:20px;background:var(--teal);color:#09232b;font-size:28px;font-weight:900;flex-shrink:0}.statline{display:flex;justify-content:space-between;gap:8px;align-items:center}.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .25s}.gold{color:var(--gold)}.ringrow{display:flex;align-items:center;gap:14px}.ring{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(var(--teal) var(--p,0%),var(--line) 0);position:relative}.ring:before{content:"";position:absolute;inset:7px;background:var(--panel);border-radius:50%}.ring b{position:relative;font-size:14px}.quest{display:flex;gap:10px;align-items:flex-start}.check{width:44px;height:44px;border-radius:50%;padding:0;flex-shrink:0;font-size:20px;border:2px solid var(--teal);background:transparent;color:var(--teal)}.check.done{background:var(--teal);color:#09232b}.questmain{flex:1;min-width:0}.questtitle{font-weight:700;overflow-wrap:anywhere}.questdone .questtitle{text-decoration:line-through;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions button{min-height:36px;padding:5px 10px;font-size:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fieldgrid .full{grid-column:1/-1}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}.tab{border:0;background:transparent;border-radius:12px;padding:6px 1px;min-height:54px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tab b{font-size:19px;font-weight:600}.tab.active{background:var(--panel2);color:var(--teal);font-weight:800}.hidden{display:none!important}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionhead h2{margin:0}.toast{position:fixed;z-index:10;left:50%;bottom:95px;transform:translateX(-50%);background:var(--teal);color:#08252b;padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);max-width:90vw;text-align:center;animation:pop .22s ease-out}.celebrate{animation:glow .65s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes glow{50%{box-shadow:0 0 0 5px #42d6c433,0 0 35px #42d6c455}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:12px;color:var(--muted)}.chart{width:100%;display:block;overflow:visible}.chart text{font-family:system-ui,sans-serif;fill:var(--muted);font-size:10px}.chart .gridline{stroke:var(--line);stroke-width:1}.chart .barshape{fill:var(--teal)}.chart .trend{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.chart .line{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.chart .goal{stroke:var(--gold);stroke-dasharray:4 4;stroke-width:1.5}.chartwrap{overflow:hidden}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.insight{border-left:3px solid var(--teal)}.achievement{display:flex;gap:10px;align-items:flex-start}.achievement .medal{font-size:23px;opacity:1}.locked{opacity:.42}.error{color:var(--red)}.success{color:var(--teal)}.danger{border-color:var(--red);color:var(--red)}.spacer{height:5px}footer{padding:18px 2px;color:var(--muted);font-size:12px;text-align:center}svg{max-width:100%}
</style></head>
<body><main class="wrap">
<header class="topline"><div><div class="brand">LIFE<span>QUEST</span></div><div class="tiny" id="greeting">Small actions. Real momentum.</div></div><span class="pill">OFFLINE FIRST</span></header>
<div id="app"></div>
</main>
<nav class="tabs" aria-label="Main navigation">
<button class="tab active" data-tab="quests"><b>◉</b>Quests</button><button class="tab" data-tab="progress"><b>▥</b>Progress</button><button class="tab" data-tab="coach"><b>✳</b>Coach</button><button class="tab" data-tab="rewards"><b>◇</b>Rewards</button><button class="tab" data-tab="more"><b>☷</b>More</button>
</nav><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='lifequest.data.v1', SCHEMA=2, STATS=['Mind','Body','Craft','Spirit'];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateShift=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const id=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const level=x=>Math.floor(Math.sqrt(Math.max(0,x)/50))+1;
const nextFloor=l=>50*l*l, floorXP=l=>50*(l-1)*(l-1);
const baseData=()=>({schemaVersion:SCHEMA,playerName:'Adventurer',xp:0,coins:0,stats:{Mind:0,Body:0,Craft:0,Spirit:0},quests:[],rewards:[],achievements:{},events:[],dailyTotals:[],weights:[],moods:[],redemptions:[],settings:{weightGoalKg:'',reminderTime:'20:00',reminderOn:false,aiProvider:'OpenAI',aiModel:'gpt-4.1-mini',aiKey:'',aiShareJournal:false}});
function safeRead(){try{let raw=localStorage.getItem(KEY);if(!raw)return baseData();let d=JSON.parse(raw);if(!d||typeof d!=='object')return baseData();if(!d.schemaVersion)d.schemaVersion=1;if(!d.stats)d.stats={};if(!d.settings)d.settings={};let b=baseData();d={...b,...d,stats:{...b.stats,...d.stats},settings:{...b.settings,...d.settings}};['quests','rewards','events','dailyTotals','weights','moods','redemptions'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});if(!d.achievements||typeof d.achievements!=='object')d.achievements={};d.quests=d.quests.filter(q=>q&&q.id&&q.title).map(q=>({...q,type:q.type==='once'?'once':'daily',streak:+q.streak||0,baseXP:+q.baseXP||10,previous:q.previous||null}));d.schemaVersion=SCHEMA;return d}catch(e){return baseData()}}
let data=safeRead(), tab='quests', range=7, editId=null, addStarterHint=false, eraseStage=0, chartCache=null, aiResults=null;
function save(){try{data.schemaVersion=SCHEMA;let cutoff=dateShift(localDate(),-730);data.events=data.events.filter(e=>e.date>=cutoff);data.dailyTotals=data.dailyTotals.filter(e=>e.date<cutoff).slice(-800);localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast('Could not save. Device storage may be full.','error')}}
function toast(msg,kind=''){let el=$('#toast');el.className='toast '+kind;el.textContent=msg;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.style.display='none'},2600)}
function todayEvents(){return data.events.filter(e=>e.date===localDate())}
function doneToday(q){return q.type==='daily'?q.lastDone===localDate():q.completed===true}
function streakNow(q){if(!q.lastDone)return 0;let diff=dayDiff(q.lastDone,localDate());return diff<=1?(+q.streak||0):0}
function addAchievement(key,label){if(data.achievements[key])return;data.achievements[key]={date:localDate(),label};toast('Achievement unlocked: '+label);document.querySelector('.hero')?.classList.add('celebrate')}
function checkAchievements(){let n=data.events.length+data.dailyTotals.reduce((a,e)=>a+(e.completions||0),0);if(n>=1)addAchievement('first','First step');if(n>=10)addAchievement('momentum','Momentum');if(n>=50)addAchievement('relentless','Relentless');if(level(data.xp)>=5)addAchievement('rising','Rising');let byQuest={};data.events.forEach(e=>{(byQuest[e.questId]??=[]).push(e.date)});let week=Object.values(byQuest).some(ds=>new Set(ds).size>=7&&ds.some(d=>dayDiff(d,localDate())<=6));if(week)addAchievement('week','Week streak');if(data.redemptions.length)addAchievement('treat','Treat yourself');let daily=data.quests.filter(q=>q.type==='daily');if(daily.length&&daily.every(doneToday))addAchievement('perfect','Perfect day');}
function addQuest(title,stat,baseXP,type='daily'){title=String(title||'').trim().slice(0,160);if(!title)return false;data.quests.push({id:id(),title,stat:STATS.includes(stat)?stat:'Mind',baseXP:+baseXP||10,type,streak:0,lastDone:null,completed:false,previous:null});return true}
function completeQuest(q){if(doneToday(q)){undoQuest(q);return}let now=localDate(), gap=q.lastDone?dayDiff(q.lastDone,now):0;if(gap>=3)addAchievement('comeback','Comeback');let oldStreak=q.lastDone&&dayDiff(q.lastDone,now)===1?(+q.streak||0):0;let newStreak=oldStreak+1;let xp=Math.round(q.baseXP*(1+.1*Math.min(newStreak-1,10))), coins=Math.max(1,Math.round(xp/5));q.previous={xp,coins,stat:q.stat,date:now,oldStreak:q.streak||0,oldLastDone:q.lastDone||null,oldCompleted:!!q.completed,eventId:id()};q.streak=newStreak;q.lastDone=now;if(q.type==='once')q.completed=true;data.xp+=xp;data.stats[q.stat]=(data.stats[q.stat]||0)+xp;data.coins+=coins;data.events.push({date:now,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),questId:q.id,title:q.title,stat:q.stat,xp,coins,eventId:q.previous.eventId});save();checkAchievements();toast(`+${xp} XP · +${coins} coins`);render()}
function undoQuest(q){let p=q.previous;if(!p){toast('No completion to undo.');return}data.xp=Math.max(0,data.xp-p.xp);data.stats[p.stat]=Math.max(0,(data.stats[p.stat]||0)-p.xp);data.coins=Math.max(0,data.coins-p.coins);q.streak=p.oldStreak;q.lastDone=p.oldLastDone;q.completed=p.oldCompleted;q.previous=null;data.events=data.events.filter(e=>e.eventId!==p.eventId);save();toast('Completion reversed');render()}
function removeQuest(qid){let q=data.quests.find(q=>q.id===qid);if(!q)return;if(q.previous){toast('Undo the completion before deleting this quest.');return}data.quests=data.quests.filter(q=>q.id!==qid);save();render()}
const starter=[
['Body','Walk 30 minutes',20,'daily'],['Body','20-minute workout',20,'daily'],['Body','Drink 3 litres of water',10,'daily'],['Body','No sugary drinks or snacks',10,'daily'],['Body','In bed by 11 pm',10,'daily'],
['Mind','Pathology 1 hour',40,'daily'],['Mind','Pharmacology 1 hour',40,'daily'],['Mind','Microbiology 1 hour',40,'daily'],['Mind','Forensic Medicine 30 minutes',20,'daily'],['Mind','Community Medicine 30 minutes',20,'daily'],['Mind','Anatomy revision 45 minutes',40,'daily'],['Mind','Solve 20 MCQs',20,'daily'],['Mind',"Revise yesterday's notes",10,'daily'],['Mind','90 minutes phone-free deep work',40,'daily'],['Mind','Finish my top 3 tasks',20,'daily'],['Mind','Plan tomorrow in 5 minutes',10,'daily'],
['Craft','Write 300 words of a story',20,'daily'],['Craft','Write 1,000 words',40,'daily'],['Craft','Read 20 pages',10,'daily'],['Craft','Play guitar 20 minutes',20,'daily'],
['Spirit','Message or call a friend',10,'daily'],['Spirit','Spend time with someone in person',20,'daily'],['Spirit','10 quiet minutes, no phone',10,'daily'],['Spirit','Journal 5 lines',10,'daily'],
['Craft','Finish a full short story',40,'once'],['Body','Lose my first 2 kg',40,'once'],['Mind','Finish one full subject revision',40,'once']];
const starterRewards=[['1 hour guilt-free free time',30],['Movie night',60],['Favourite meal out',100],['New book',150],['Big treat',250]];
function starterPack(){let count=0;starter.forEach(([s,t,x,ty])=>{if(!data.quests.some(q=>q.title.toLowerCase()===t.toLowerCase())){addQuest(t,s,x,ty);count++}});starterRewards.forEach(([title,cost])=>{if(!data.rewards.some(r=>r.title===title))data.rewards.push({id:id(),title,cost})});save();toast(`Starter pack ready · ${count} quests added`);render()}
function pageQuests(){let daily=data.quests.filter(q=>q.type==='daily'),done=daily.filter(doneToday).length, pct=daily.length?done/daily.length*100:0,lv=level(data.xp),within=data.xp-floorXP(lv),need=nextFloor(lv)-floorXP(lv);let list=data.quests.map(q=>`<div class="card quest ${doneToday(q)?'questdone':''}"><button class="check ${doneToday(q)?'done':''}" aria-label="${doneToday(q)?'Undo':'Complete'} ${esc(q.title)}" data-complete="${q.id}">${doneToday(q)?'✓':'○'}</button><div class="questmain"><div class="questtitle">${esc(q.title)}</div><div class="tiny">${esc(q.stat)} · ${q.baseXP} base XP · ${streakNow(q)} day streak · ${q.type==='once'?'Boss fight':'Daily'}</div><div class="actions"><button data-edit="${q.id}">Edit</button><button data-delete="${q.id}">Delete</button></div></div></div>`).join('');
return `<section class="card hero"><div class="levelrow"><div class="level">${lv}</div><div style="flex:1"><div class="statline"><h2 style="margin:0">${esc(data.playerName||'Adventurer')}</h2><strong class="gold">◈ ${data.coins} coins</strong></div><div class="muted">${data.xp.toLocaleString()} total XP</div><div class="bar"><i style="width:${Math.min(100,within/Math.max(1,need)*100)}%"></i></div><div class="tiny">${within} / ${need} XP to level ${lv+1}</div></div></div></section>
<section class="card"><div class="ringrow"><div class="ring" style="--p:${pct}%"><b>${done}/${daily.length}</b></div><div><h2 style="margin-bottom:3px">Today's progress</h2><div class="muted">${daily.length?Math.round(pct)+'% of daily quests completed':'Add a daily quest to start your run.'}</div></div></div></section>
<div class="sectionhead"><h2>Your quests</h2><button class="primary" data-action="starter">Starter pack</button></div>
${list||'<div class="empty">Your quest board is empty. Add one small, doable quest below.</div>'}
<section class="card"><h2>${editId?'Edit quest':'Add quest'}</h2><div class="fieldgrid"><div class="full"><label for="qtitle">Quest name</label><input id="qtitle" maxlength="160" placeholder="e.g. Revise one lecture"></div><div><label for="qstat">Stat</label><select id="qstat">${STATS.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label for="qdifficulty">Difficulty / base XP</label><select id="qdifficulty"><option value="10">Easy · 10 XP</option><option value="20">Medium · 20 XP</option><option value="40">Hard · 40 XP</option></select></div><div class="full"><label for="qtype">Quest type</label><select id="qtype"><option value="daily">Daily</option><option value="once">One-time boss fight</option></select></div><div class="full actions"><button class="primary" data-action="savequest">${editId?'Save changes':'Add quest'}</button>${editId?'<button data-action="canceledit">Cancel</button>':''}</div></div></section>
<section class="card"><h2>Quick check-in</h2><p class="muted">A tiny snapshot, not a judgment.</p><div class="fieldgrid"><div><label for="mood">Mood (1–5)</label><select id="mood">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}${[' · low',' · rough',' · okay',' · good',' · great'][n-1]}</option>`).join('')}</select></div><div><label for="energy">Energy (1–5)</label><select id="energy">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div><div class="full"><label for="weight">Weight in kg (optional)</label><input id="weight" inputmode="decimal" type="number" min="20" max="400" step=".1" placeholder="e.g. 84.5"></div><div class="full"><button class="primary" data-action="checkin">Save today's check-in</button></div></div><div class="tiny">Re-saving today replaces today's mood, energy and weight entry.</div></section>`}
function statCards(){return STATS.map(s=>{let x=data.stats[s]||0,l=level(x),w=(x-floorXP(l))/Math.max(1,nextFloor(l)-floorXP(l))*100;return `<div class="card"><div class="statline"><b>${s}</b><span class="pill">Lv ${l}</span></div><div class="bar"><i style="width:${w}%"></i></div><div class="tiny">${x} XP · ${Math.round(w)}% to next level</div></div>`}).join('')}
function svgWrap(title,summary,svg){return `<section class="card chartwrap"><h3>${title}</h3><div class="tiny">${esc(summary)}</div>${svg||'<div class="empty">Not enough data yet. Complete quests or record a check-in to populate this chart.</div>'}</section>`}
function chartLine(points,w=320,h=140,goal=null){if(points.length<1)return '';let vals=points.map(p=>p.v),min=Math.min(...vals,goal??Infinity),max=Math.max(...vals,goal??-Infinity);if(min===max){max+=1;min=Math.max(0,min-1)}let pad=22, x=i=>pad+i*(w-2*pad)/Math.max(1,points.length-1), y=v=>h-pad-(v-min)/(max-min)*(h-2*pad);let path=points.map((p,i)=>(i?'L':'M')+x(i)+','+y(p.v)).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(points.map(p=>p.l+': '+p.v).join(', '))}"><line class="gridline" x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}"/>${goal!==null?`<line class="goal" x1="${pad}" y1="${y(goal)}" x2="${w-pad}" y2="${y(goal)}"/>`:''}<path class="line" d="${path}"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="2.5" fill="var(--teal)"/>`).join('')}<text x="${pad}" y="${h-5}">${esc(points[0].l)}</text><text x="${w-pad}" y="${h-5}" text-anchor="end">${esc(points[points.length-1].l)}</text><text x="${pad}" y="11">${max.toFixed(1)}</text><text x="${pad}" y="${h-pad-3}">${min.toFixed(1)}</text></svg>`}
function xpChart(){let days=Array.from({length:range},(_,i)=>dateShift(localDate(),i-(range-1)));let vals=days.map(d=>({date:d,v:data.events.filter(e=>e.date===d).reduce((a,e)=>a+e.xp,0)}));data.dailyTotals.forEach(t=>{let o=vals.find(v=>v.date===t.date);if(o)o.v+=t.xp||0});if(!vals.some(v=>v.v))return '';let w=320,h=155,p=24,max=Math.max(1,...vals.map(v=>v.v)),step=(w-p*2)/vals.length,bw=Math.max(2,step*.65),pts=vals.map((v,i)=>({x:p+i*step+step/2,y:h-p-v.v/max*(h-2*p)}));let trend=pts.map((pt,i)=>({x:pt.x,y:h-p-(vals.reduce((a,v)=>a+v.v,0)/vals.length)/max*(h-2*p)}));let path=pts.map((pt,i)=>(i?'L':'M')+pt.x+','+pt.y).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily XP: ${vals.map(v=>v.date+' '+v.v).join('; ')}"><line class="gridline" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/>${vals.map((v,i)=>`<rect class="barshape" x="${p+i*step+(step-bw)/2}" y="${h-p-v.v/max*(h-2*p)}" width="${bw}" height="${Math.max(0,v.v/max*(h-2*p))}" rx="2"/>`).join('')}<path class="trend" d="M${p},${h-p-(vals.reduce((a,v)=>a+v.v,0)/vals.length)/max*(h-2*p)} L${w-p},${h-p-(vals.reduce((a,v)=>a+v.v,0)/vals.length)/max*(h-2*p)}"/>${[0,Math.floor((range-1)/2),range-1].map(i=>`<text x="${p+i*step+step/2}" y="${h-5}" text-anchor="middle">${vals[i].date.slice(5)}</text>`).join('')}</svg>`}

if(a==='savequest'){let title=$('#qtitle').value,stat=$('#qstat').value,type=$('#qtype').value; if(!title.trim()){toast('Give your quest a name.');return}if(editId){let q=data.quests.find(q=>q.id===editId);if(q){q.title=title.trim().slice(0,160);q.stat=stat;q.baseXP=xp;q.type=type;if(type==='daily')q.completed=false;}editId=null}else addQuest(title,stat,+$('#qdifficulty').value,type);save();render();toast('Quest saved');return}
if(a==='canceledit'){editId=null;render();return}
if(a==='checkin'){let mood=+$('#mood').value,energy=+$('#energy').value,weight=$('#weight').value.trim(),d=localDate();data.moods=data.moods.filter(m=>m.date!==d);data.moods.push({date:d,mood,energy});if(weight&&Number.isFinite(+weight)&&+weight>=20&&+weight<=400){data.weights=data.weights.filter(w=>w.date!==d);data.weights.push({date:d,kg:+(+weight).toFixed(1)})}save();toast('Check-in saved');return}
if(a==='addreward'){let title=$('#rtitle').value.trim(),cost=+$('#rcost').value,edit=$('#rtitle').dataset.edit;if(!title||!Number.isFinite(cost)||cost<1){toast('Enter a reward and positive coin cost.');return}if(edit){let r=data.rewards.find(r=>r.id===edit);if(r){r.title=title;r.cost=Math.round(cost)}delete $('#rtitle').dataset.edit}else data.rewards.push({id:id(),title,cost:Math.round(cost)});save();render();toast('Reward saved');return}
if(a==='savesettings'){data.playerName=$('#player').value.trim().slice(0,60)||'Adventurer';let g=$('#goal').value;data.settings.weightGoalKg=g&&+g>=20&&+g<=400?String(+g):'';save();render();toast('Settings saved');return}
if(a==='saveai'){data.settings.aiProvider=$('#provider').value;data.settings.aiModel=$('#model').value.trim()||'gpt-4.1-mini';data.settings.aiKey=$('#apikey').value.trim();data.settings.aiShareJournal=$('#sharejournal').checked;save();toast('AI settings saved');render();return}
if(a==='clearai'){data.settings.aiKey='';save();toast('AI key cleared');render();return}
if(a==='moreai'){tab='more';render();return}
if(a==='ai'){await askAI();return}
if(a==='export'){$('#backup').value=JSON.stringify(data,null,2);$('#backupstatus').textContent='Export ready. Copy or save this text somewhere private.';return}
if(a==='copy'){try{await navigator.clipboard.writeText($('#backup').value);$('#backupstatus').textContent='Copied.'}catch(err){$('#backupstatus').textContent='Clipboard unavailable. Select the text and copy it manually.'}return}
if(a==='import'){try{let d=JSON.parse($('#backup').value);let err=validateImport(d);if(err)throw new Error(err);data=normalizeImport(d);save();eraseStage=0;render();toast('Backup restored')}catch(err){$('#backupstatus').textContent='Import failed: '+err.message}return}
if(a==='erase1'){eraseStage=1;render();return}
if(a==='erase2'){try{localStorage.removeItem(KEY)}catch(e){}data=baseData();eraseStage=2;editId=null;save();render();toast('All data erased');return}
if(a==='erasecancel'){eraseStage=0;render();return}
if(a==='reminder'){data.settings.reminderTime=$('#remtime').value||'20:00';data.settings.reminderOn=$('#remon').checked;save();await scheduleReminder();return}
});
function validateImport(d){if(!d||typeof d!=='object'||Array.isArray(d))return 'Expected a JSON object.';if(!Array.isArray(d.quests)||!Array.isArray(d.events)||!d.stats||typeof d.stats!=='object')return 'Missing required quest, event or stat data.';if(d.quests.length>500||d.events.length>100000)return 'Backup exceeds safety limits.';if(!Number.isFinite(+d.xp)||+d.xp<0||!Number.isFinite(+d.coins)||+d.coins<0)return 'XP and coins must be non-negative numbers.';for(let q of d.quests)if(!q.id||typeof q.title!=='string'||!STATS.includes(q.stat)||!['daily','once'].includes(q.type))return 'A quest has invalid fields.';for(let e of d.events)if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!Number.isFinite(+e.xp))return 'An event has invalid fields.';return ''}
function normalizeImport(d){let b=baseData();return {...b,...d,schemaVersion:SCHEMA,stats:{...b.stats,...d.stats},settings:{...b.settings,...d.settings},quests:d.quests,rewards:Array.isArray(d.rewards)?d.rewards:[],events:d.events,dailyTotals:Array.isArray(d.dailyTotals)?d.dailyTotals:[],weights:Array.isArray(d.weights)?d.weights:[],moods:Array.isArray(d.moods)?d.moods:[],redemptions:Array.isArray(d.redemptions)?d.redemptions:[],achievements:d.achievements||{}}}
async function scheduleReminder(){let out=$('#remstatus');try{let plug=window.Capacitor?.Plugins?.LocalNotifications;if(!plug){out.textContent='This browser/PWA does not support scheduled local notifications. Use the Android app build.';return}await plug.cancel({notifications:[{id:9042}]});if(!data.settings.reminderOn){out.textContent='Reminder disabled.';return}let perm=await plug.requestPermissions();if(perm.display!=='granted'){out.textContent='Notification permission denied. Enable notifications for LifeQuest in Android Settings → Apps → LifeQuest → Notifications.';return}let [hour,minute]=data.settings.reminderTime.split(':').map(Number);let at=new Date();at.setHours(hour||20,minute||0,0,0);if(at<=new Date())at.setDate(at.getDate()+1);await plug.schedule({notifications:[{id:9042,title:'LifeQuest',body:'Your quests are waiting.',schedule:{at,repeats:true,allowWhileIdle:true}}]});out.textContent='Daily reminder scheduled.'}catch(e){out.textContent='Reminder could not be scheduled: '+(e.message||'unknown error')}}
function compactSummary(){let from=dateShift(localDate(),-29),ev=data.events.filter(e=>e.date>=from),byStat={};STATS.forEach(s=>byStat[s]=ev.filter(e=>e.stat===s).reduce((a,e)=>a+e.xp,0));let daily=data.quests.filter(q=>q.type==='daily').length,days=Array.from({length:30},(_,i)=>dateShift(localDate(),-29+i));return {period:{from,to:localDate()},xpByStat:byStat,totalXP:ev.reduce((a,e)=>a+e.xp,0),completions:ev.length,dailyCompletionRates:days.map(d=>({date:d,rate:daily?Math.round(ev.filter(e=>e.date===d).length/daily*100):0})),streaks:data.quests.map(q=>({title:q.title,streak:streakNow(q)})),weightTrend:data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-30),moodAverages:{mood:data.moods.filter(m=>m.date>=from).length?+(data.moods.filter(m=>m.date>=from).reduce((a,m)=>a+m.mood,0)/data.moods.filter(m=>m.date>=from).length).toFixed(2):null,energy:data.moods.filter(m=>m.date>=from).length?+(data.moods.filter(m=>m.date>=from).reduce((a,m)=>a+m.energy,0)/data.moods.filter(m=>m.date>=from).length).toFixed(2):null},questTitles:data.quests.map(q=>({title:q.title,stat:q.stat,type:q.type})),journalTitles:data.settings.aiShareJournal?data.quests.map(q=>q.title):undefined}}
async function askAI(){let s=data.settings,err=$('#aierror');if(!s.aiKey){toast('Add an API key in More first.');return}if(!navigator.onLine){toast('Offline. Showing local insights instead.');return}toast('Requesting review…');let summary=compactSummary(),prompt=`You are a practical, non-medical life coach. Analyze this JSON summary. Return ONLY valid JSON with keys summary (string), strengths (array of 3 strings), problems (array of 3 strings), plan (array of 7 short day-by-day strings), quests (array of 3 objects with title, stat one of Mind/Body/Craft/Spirit, difficulty Easy/Medium/Hard). Be specific, realistic, avoid shame, and do not invent missing data. Mention weight observations are not medical advice. Data: ${JSON.stringify(summary)}`;let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{let url,headers,body;if(s.aiProvider==='Anthropic'){url='https://api.anthropic.com/v1/messages';headers={'content-type':'application/json','x-api-key':s.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};body={model:s.aiModel,max_tokens:1800,messages:[{role:'user',content:prompt}]}}else{url='https://api.openai.com/v1/chat/completions';headers={'content-type':'application/json','authorization':'Bearer '+s.aiKey};body={model:s.aiModel,temperature:.4,response_format:{type:'json_object'},messages:[{role:'user',content:prompt}]}}let res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:controller.signal});if(!res.ok){let msg=res.status===401?'API key rejected. Check the key in More → AI settings.':res.status===429?'Rate limit or quota reached. Try later.':`Provider returned HTTP ${res.status}. Check provider, model and account access.`;throw new Error(msg)}let j=await res.json(),content=s.aiProvider==='Anthropic'?(j.content||[]).map(c=>c.text||'').join(''):j.choices?.[0]?.message?.content;if(!content)throw new Error('The provider returned an empty response.');content=content.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let r=JSON.parse(content);if(!r||typeof r.summary!=='string'||!Array.isArray(r.quests))throw new Error('The response was not the expected structured JSON.');r.quests=r.quests.filter(q=>q&&typeof q.title==='string'&&STATS.includes(q.stat)&&['Easy','Medium','Hard'].includes(q.difficulty)).slice(0,3);aiResults=r;err.textContent='';render()}catch(e){err.textContent=(e.name==='AbortError'?'Request timed out.':e.message||'Network error')+' Local insights are still available below.';toast('AI review unavailable; local coach remains ready.')}finally{clearTimeout(timer)}}
function backButton(){if(tab!=='quests'){tab='quests';editId=null;render();return}if(window.Capacitor?.Plugins?.App){window.Capacitor.Plugins.App.exitApp()}else{history.back()}}
try{window.Capacitor?.Plugins?.App?.addListener?.('backButton',backButton)}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(!data.quests.length&&!data.rewards.length){/* clean first launch; starter pack is optional */}save();render();
</script></body></html>
